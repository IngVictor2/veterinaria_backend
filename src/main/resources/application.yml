server:
    port: ${PORT:8080}

spring:
    application:
        name: veterinaria

    datasource:
        url: jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
        open-in-view: true
        properties:
            hibernate:
                format_sql: true

    jackson:
        time-zone: America/Bogota

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        operationsSorter: method
        tryItOutEnabled: true
    packages-to-scan: co.edu.iub.veterinaria.controller
    show-actuator: false

logging:
    level:
        web: DEBUG
        org.springframework.web: DEBUG

app:
    jwt:
        secret: ${JWT_SECRET:this-is-a-dev-secret-must-be-at-least-32-bytes}
        expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}

    wompi:
        base-url: ${WOMPI_BASE_URL:https://sandbox.wompi.co/v1}
        public-key: ${WOMPI_PUBLIC_KEY:}
        private-key: ${WOMPI_PRIVATE_KEY:}
        integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
        events-secret: ${WOMPI_EVENTS_SECRET:}
        currency: COP

    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,https://vetclinic-h6ohzil4r-sapoturcos-projects.vercel.app,https://vetclinic-eight.vercel.app,https://veterinaria-one-nu.vercel.app}
